name: Release Workflow

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to update (leave empty for all)'
        required: false
        type: string
      version:
        description: 'Specific version to build (leave empty to use API)'
        required: false
        type: string
      force_build:
        description: 'Force build even if no updates found'
        required: false
        type: boolean
        default: false
      force_overwrite:
        description: 'Force overwrite existing assets on upload'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'  # Trigger on version tags
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for trusted publishing with OIDC

jobs:
  # =============================================================================
  # Phase 1: Check for updates and generate build matrix
  # =============================================================================
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-updates: ${{ steps.set-matrix.outputs.has-updates }}
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest

      - name: Update pixi lock file if needed
        run: |
          echo "Checking if pixi.lock is up to date..."
          if ! pixi install --locked 2>&1 | grep -q "up-to-date"; then
            echo "Lock file out of date, updating..."
            pixi install

            if git diff --quiet pixi.lock; then
              echo "Lock file is now up to date (no changes needed)"
            else
              echo "Lock file updated, committing changes..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add pixi.lock
              git commit -m "chore: update pixi.lock file [skip ci]"
              git push
              echo "Lock file committed and pushed"
            fi
          else
            echo "Lock file is already up to date"
          fi

      - name: Check for updates
        id: check
        run: |
          # Create array of packages that need updates
          UPDATES="[]"

          # Check claude-shim (shim doesn't auto-update version, only force_build triggers it)
          if [ -d "recipes/claude-shim" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "claude-shim" ]); then
            echo "Checking claude-shim..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/claude-shim/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # claude-shim is versioned independently - only build on force_build or version override
            if [ -n "${{ github.event.inputs.version }}" ]; then
              LATEST="${{ github.event.inputs.version }}"
              echo "Using custom version: $LATEST"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "claude-shim", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            elif [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build requested for claude-shim $CURRENT"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "claude-shim", "current": "'$CURRENT'", "latest": "'$CURRENT'"}]')
            else
              echo "claude-shim - no build requested (use force_build or specify version)"
            fi
          fi

          # Check codex-shim (bootstrap shim - versioned independently; only force_build or version triggers a build)
          if [ -d "recipes/codex-shim" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "codex-shim" ]); then
            echo "Checking codex-shim..."

            CURRENT=$(grep -A 3 'package:' recipes/codex-shim/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            if [ -n "${{ github.event.inputs.version }}" ]; then
              LATEST="${{ github.event.inputs.version }}"
              echo "Using custom version: $LATEST"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "codex-shim", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            elif [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build requested for codex-shim $CURRENT"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "codex-shim", "current": "'$CURRENT'", "latest": "'$CURRENT'"}]')
            else
              echo "codex-shim - no build requested (use force_build or specify version)"
            fi
          fi

          # Check opencode-shim (bootstrap shim - versioned independently; only force_build or version triggers a build)
          if [ -d "recipes/opencode-shim" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "opencode-shim" ]); then
            echo "Checking opencode-shim..."

            CURRENT=$(grep -A 3 'package:' recipes/opencode-shim/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            if [ -n "${{ github.event.inputs.version }}" ]; then
              LATEST="${{ github.event.inputs.version }}"
              echo "Using custom version: $LATEST"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "opencode-shim", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            elif [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build requested for opencode-shim $CURRENT"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "opencode-shim", "current": "'$CURRENT'", "latest": "'$CURRENT'"}]')
            else
              echo "opencode-shim - no build requested (use force_build or specify version)"
            fi
          fi

          # Check devpod
          if [ -d "recipes/devpod" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "devpod" ]); then
            echo "Checking devpod for updates..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/devpod/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Get latest version from GitHub releases API
            LATEST=$(curl -s https://api.github.com/repos/skevetter/devpod/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": "v\([^"]*\)".*/\1/' || echo "")
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: devpod $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "devpod", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "devpod is up to date"
            fi
          fi

          # Check iterfzf (PyPI package)
          if [ -d "recipes/iterfzf" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "iterfzf" ]); then
            echo "Checking iterfzf for updates..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/iterfzf/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Get latest version from PyPI
            LATEST=$(curl -s https://pypi.org/pypi/iterfzf/json | jq -r '.info.version // empty')
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: iterfzf $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "iterfzf", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "iterfzf is up to date"
            fi
          fi

          # Check isd (PyPI package: isd-tui)
          if [ -d "recipes/isd" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "isd" ]); then
            echo "Checking isd for updates..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/isd/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Get latest version from PyPI (project is named isd-tui)
            LATEST=$(curl -s https://pypi.org/pypi/isd-tui/json | jq -r '.info.version // empty')
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: isd $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "isd", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "isd is up to date"
            fi
          fi

          # Check devpod-prerelease
          if [ -d "recipes/devpod-prerelease" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "devpod-prerelease" ]); then
            echo "Checking devpod-prerelease for updates..."

            # Get current version from recipe (may have underscores for conda compatibility)
            CURRENT=$(grep -A 3 'package:' recipes/devpod-prerelease/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Get latest prerelease version from GitHub releases API
            # This finds the first prerelease with assets (non-empty assets array)
            LATEST=$(curl -s https://api.github.com/repos/skevetter/devpod/releases | jq -r '[.[] | select(.prerelease == true and (.assets | length) > 0)][0].tag_name // ([.[] | select((.assets | length) > 0)][0].tag_name) // empty' | sed 's/^v//' || echo "")
            echo "Latest prerelease: $LATEST"

            # Normalize versions for comparison (conda uses underscores, GitHub uses hyphens)
            CURRENT_NORMALIZED=$(echo "$CURRENT" | tr '_' '-')
            LATEST_NORMALIZED=$(echo "$LATEST" | tr '-' '_')

            if [ -n "$LATEST" ] && ([ "$CURRENT_NORMALIZED" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: devpod-prerelease $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              # Pass the original GitHub version (with hyphens) - the update script will handle conversion
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "devpod-prerelease", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "devpod-prerelease is up to date"
            fi
          fi

          # Check speedtest-go
          if [ -d "recipes/speedtest-go" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "speedtest-go" ]); then
            echo "Checking speedtest-go for updates..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/speedtest-go/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Get latest version from GitHub releases API
            LATEST=$(curl -s https://api.github.com/repos/showwin/speedtest-go/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": "v\([^"]*\)".*/\1/' || echo "")
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: speedtest-go $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "speedtest-go", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "speedtest-go is up to date"
            fi
          fi

          # Check pkl
          if [ -d "recipes/pkl" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "pkl" ]); then
            echo "Checking pkl for updates..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/pkl/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Get latest version from GitHub releases API (pkl uses bare version numbers, no v prefix)
            LATEST=$(curl -s https://api.github.com/repos/apple/pkl/releases/latest | jq -r '.tag_name // empty' || echo "")
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: pkl $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "pkl", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "pkl is up to date"
            fi
          fi

          # Check pi
          if [ -d "recipes/pi" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "pi" ]); then
            echo "Checking pi for updates..."

            CURRENT=$(grep -A 3 'package:' recipes/pi/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # Resolve from the releases redirect rather than api.github.com. Two
            # reasons this check was silently broken: upstream renamed the repo
            # (badlogic/pi-mono -> earendil-works/pi) and `curl -s` does not follow
            # the 301, so it parsed the redirect body, found no tag_name, and left
            # LATEST empty — which this block reads as "up to date". pi therefore sat
            # at 0.73.0 while upstream shipped 11 releases. The redirect also avoids
            # the API's 60 req/hour/IP limit, which fails the same silent way.
            LATEST=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
              https://github.com/earendil-works/pi/releases/latest \
              | sed -n 's#.*/releases/tag/v##p' || echo "")
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: pi $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "pi", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "pi is up to date"
            fi
          fi

          # Check krill (Rust source build - no releases, uses commit-based versioning)
          if [ -d "recipes/krill" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "krill" ]); then
            echo "Checking krill..."

            # Get current version from recipe
            CURRENT=$(grep -A 3 'package:' recipes/krill/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            # krill is built from source at a specific commit - only build on force_build
            if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build requested for krill $CURRENT"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "krill", "current": "'$CURRENT'", "latest": "'$CURRENT'"}]')
            else
              echo "krill - no build requested (use force_build to rebuild)"
            fi
          fi

          # Check uhk-agent
          if [ -d "recipes/uhk-agent" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "uhk-agent" ]); then
            echo "Checking uhk-agent for updates..."

            CURRENT=$(grep -A 3 'package:' recipes/uhk-agent/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            LATEST=$(curl -s https://api.github.com/repos/UltimateHackingKeyboard/agent/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": "v\([^"]*\)".*/\1/' || echo "")
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: uhk-agent $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "uhk-agent", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "uhk-agent is up to date"
            fi
          fi

          # Check kitty-bin
          if [ -d "recipes/kitty-bin" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "kitty-bin" ]); then
            echo "Checking kitty-bin for updates..."

            CURRENT=$(grep -A 3 'package:' recipes/kitty-bin/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            LATEST=$(curl -s https://api.github.com/repos/kovidgoyal/kitty/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": "v\([^"]*\)".*/\1/' || echo "")
            echo "Latest version: $LATEST"

            if [ -n "$LATEST" ] && ([ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]); then
              echo "Update found: kitty-bin $CURRENT -> $LATEST (forced: ${{ github.event.inputs.force_build }})"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "kitty-bin", "current": "'$CURRENT'", "latest": "'$LATEST'"}]')
            else
              echo "kitty-bin is up to date"
            fi
          fi

          # Check claude-statusline (Rust source build from a pinned tag tarball +
          # sha256 - the version and checksum move together, by hand, so an
          # auto-detected new tag could only rebuild the old pinned source)
          if [ -d "recipes/claude-statusline" ] && ([ -z "${{ github.event.inputs.package }}" ] || [ "${{ github.event.inputs.package }}" == "claude-statusline" ]); then
            echo "Checking claude-statusline..."

            CURRENT=$(grep -A 3 'package:' recipes/claude-statusline/recipe.yaml | grep 'version:' | sed 's/.*version:[[:space:]]*"\([^"]*\)".*/\1/')
            echo "Current version: $CURRENT"

            if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
              echo "Force build requested for claude-statusline $CURRENT"
              UPDATES=$(echo $UPDATES | jq -c '. + [{"package": "claude-statusline", "current": "'$CURRENT'", "latest": "'$CURRENT'"}]')
            else
              echo "claude-statusline - no build requested (use force_build to rebuild)"
            fi
          fi

          echo "updates=$UPDATES" >> $GITHUB_OUTPUT

      - name: Set matrix
        id: set-matrix
        run: |
          UPDATES='${{ steps.check.outputs.updates }}'

          # Define platform configurations with native runners
          # Each platform runs on a runner with matching architecture
          # Note: Intel Mac (osx-64) not supported - macos-13 runners are retired
          PLATFORMS='[
            {"runner": "ubuntu-latest", "platform": "linux-64"},
            {"runner": "ubuntu-24.04-arm", "platform": "linux-aarch64"},
            {"runner": "macos-14", "platform": "osx-arm64"}
          ]'

          # Per-package platform overrides (default: all platforms)
          # Packages not listed here are built for all platforms above
          PACKAGE_PLATFORMS='{
            "uhk-agent": ["linux-64", "linux-aarch64"],
            "envoy": ["linux-64", "linux-aarch64"],
            "isd": ["linux-64"],
            "kitty-bin": ["linux-64", "linux-aarch64"]
          }'

          # Build the full matrix: each package × supported platforms
          if [ "$UPDATES" != "[]" ]; then
            MATRIX_INCLUDE=$(echo "$UPDATES" | jq -c \
              --argjson platforms "$PLATFORMS" \
              --argjson pkg_plats "$PACKAGE_PLATFORMS" '
              [.[] as $pkg | $platforms[] as $plat |
                select(
                  ($pkg_plats[$pkg.package] == null) or
                  ([$pkg_plats[$pkg.package][] | select(. == $plat.platform)] | length > 0)
                ) |
                {
                  package: $pkg.package,
                  current: $pkg.current,
                  latest: $pkg.latest,
                  runner: $plat.runner,
                  platform: $plat.platform
                }
              ]
            ')

            echo "matrix={\"include\":$MATRIX_INCLUDE}" >> $GITHUB_OUTPUT
            echo "has-updates=true" >> $GITHUB_OUTPUT
            echo "packages=$UPDATES" >> $GITHUB_OUTPUT
            echo "Build matrix:"
            echo "$MATRIX_INCLUDE" | jq .
          else
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has-updates=false" >> $GITHUB_OUTPUT
            echo "packages=[]" >> $GITHUB_OUTPUT
            echo "All packages up to date"
          fi

  # =============================================================================
  # Phase 2: Update recipes (runs once before builds)
  # =============================================================================
  prepare-recipes:
    needs: check-updates
    if: needs.check-updates.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest

      - name: Update recipes
        run: |
          PACKAGES='${{ needs.check-updates.outputs.packages }}'

          echo "$PACKAGES" | jq -c '.[]' | while read -r pkg; do
            PACKAGE=$(echo "$pkg" | jq -r '.package')
            CURRENT=$(echo "$pkg" | jq -r '.current')
            LATEST=$(echo "$pkg" | jq -r '.latest')

            echo "Updating $PACKAGE from $CURRENT to $LATEST..."

            if [ "$PACKAGE" == "claude-shim" ] || [ "$PACKAGE" == "codex-shim" ]; then
              # Independently-versioned shims: bump the recipe only if the version actually changed
              if [ "$CURRENT" != "$LATEST" ]; then
                sed -i 's/version: "'$CURRENT'"/version: "'$LATEST'"/' recipes/$PACKAGE/recipe.yaml
                echo "Updated $PACKAGE version to $LATEST"
              else
                echo "$PACKAGE version unchanged ($CURRENT)"
              fi
            else
              # Use update script for other packages
              if [ -f "scripts/update-$PACKAGE.py" ]; then
                pixi run python scripts/update-$PACKAGE.py $LATEST
              else
                echo "No update script found for $PACKAGE, skipping recipe update"
              fi
            fi
          done

      - name: Commit recipe updates
        run: |
          if git diff --quiet; then
            echo "No recipe changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add recipes/*/recipe.yaml
            git commit -m "chore: update recipes for release [skip ci]"
            git push
            echo "Recipe updates committed"
          fi

  # =============================================================================
  # Phase 3: Build packages on native runners (parallel matrix)
  # =============================================================================
  build:
    needs: [check-updates, prepare-recipes]
    if: needs.check-updates.outputs.has-updates == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.check-updates.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main  # Get the latest with recipe updates

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest

      - name: Build ${{ matrix.package }} for ${{ matrix.platform }}
        id: build
        run: |
          echo "Building ${{ matrix.package }} for ${{ matrix.platform }} on ${{ matrix.runner }}..."
          mkdir -p output

          # Build the package
          if pixi run rattler-build build \
            --recipe recipes/${{ matrix.package }}/recipe.yaml \
            --target-platform ${{ matrix.platform }} \
            --output-dir output \
            --channel conda-forge; then
            echo "Build succeeded"
            echo "success=true" >> $GITHUB_OUTPUT

            # Stage built packages into a flat dir. rattler-build writes
            # platform packages to output/<platform>/ but noarch packages to
            # output/noarch/, so collect from wherever they landed. Keeping the
            # artifact flat preserves the conda-<pkg>-<platform> artifact-name
            # dir on download, which the organize step relies on.
            mkdir -p staging
            find output -name "*.conda" -exec cp {} staging/ \;

            echo "Built packages:"
            find staging -name "*.conda" | head -20
          else
            echo "Build failed for ${{ matrix.platform }}"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload build artifact
        if: steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.package }}-${{ matrix.platform }}
          # staging/ holds the built package(s), flattened from output/<platform>/
          # or output/noarch/ — see the build step above.
          path: staging/*.conda
          if-no-files-found: error
          retention-days: 7

  # =============================================================================
  # Phase 4: Upload all packages to prefix.dev
  # =============================================================================
  upload:
    needs: [check-updates, build]
    if: always() && needs.check-updates.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: conda-*

      - name: Organize packages
        run: |
          mkdir -p output

          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.conda" | head -50

          # Move all packages into per-platform subdirs. The subdir name is
          # cosmetic (prefix.dev routes each package by its embedded metadata),
          # but separating by platform avoids filename collisions between builds.
          #
          # download-artifact creates artifacts/<artifact-name>/<file> when
          # multiple artifacts match, but flattens to artifacts/<file> when only
          # one matches (e.g. a noarch package restricted to a single platform).
          # Handle both layouts.
          shopt -s nullglob
          for pkg in artifacts/conda-*/*.conda artifacts/*.conda; do
            [ -f "$pkg" ] || continue
            dir=$(dirname "$pkg")
            if [ "$dir" != "artifacts" ]; then
              # artifacts/conda-<package>-<platform>/<file>. Package names contain
              # hyphens too (conda-speedtest-go-linux-64), so match the platform
              # suffix instead of stripping a fixed number of fields.
              platform=$(basename "$dir" | grep -oE '(linux-64|linux-aarch64|osx-64|osx-arm64|win-64|noarch)$')
              platform=${platform:-unknown}
            else
              # Flattened single artifact — only noarch packages are restricted
              # to one platform, so park it under noarch (routing is by metadata).
              platform="noarch"
            fi
            mkdir -p "output/$platform"
            cp "$pkg" "output/$platform/"
            echo "Copied $pkg to output/$platform/"
          done

          echo ""
          echo "Organized packages:"
          find output -name "*.conda" | sort

      - name: Upload to prefix.dev
        env:
          PIXI_TOKEN: ${{ secrets.PIXI_TOKEN }}
        run: |
          echo "Uploading packages to blooop channel..."

          uploaded=0
          failed=0
          skipped=0

          # prefix.dev occasionally returns transient errors (e.g. a flaky
          # 401 Unauthorized or 5xx) on an otherwise-valid upload, so retry
          # each package a few times with backoff before giving up. A single
          # transient blip must not fail the whole release.
          max_attempts=4

          for pkg in output/*/*.conda; do
            if [ -f "$pkg" ]; then
              echo ""
              echo "Uploading $(basename "$pkg")..."

              attempt=1
              status="failed"
              while [ "$attempt" -le "$max_attempts" ]; do
                if out=$(pixi run rattler-build upload prefix \
                  --skip-existing \
                  --channel blooop \
                  --api-key "$PIXI_TOKEN" \
                  "$pkg" 2>&1); then
                  echo "$out"
                  status="uploaded"
                  break
                fi

                echo "$out"

                # Already-published packages are not a failure.
                if echo "$out" | grep -q "already exists"; then
                  status="skipped"
                  break
                fi

                echo "Attempt $attempt/$max_attempts failed"
                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep_secs=$((attempt * 15))
                  echo "Retrying in ${sleep_secs}s..."
                  sleep "$sleep_secs"
                fi
                attempt=$((attempt + 1))
              done

              case "$status" in
                uploaded)
                  echo "Upload succeeded"
                  uploaded=$((uploaded + 1))
                  ;;
                skipped)
                  echo "Package already exists, skipped"
                  skipped=$((skipped + 1))
                  ;;
                *)
                  echo "Upload failed after $max_attempts attempts"
                  failed=$((failed + 1))
                  ;;
              esac
            fi
          done

          echo ""
          echo "========================================="
          echo "Upload Summary:"
          echo "  Uploaded: $uploaded"
          echo "  Skipped:  $skipped"
          echo "  Failed:   $failed"
          echo "========================================="

          if [ "$failed" -gt 0 ]; then
            echo "Some uploads failed"
            exit 1
          fi

      - name: Commit recipe updates
        run: |
          git pull origin main

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add recipes/*/recipe.yaml
            git commit -m "Update package recipes [skip ci]" || echo "Nothing to commit"
            git push || echo "Nothing to push"
          fi

  # =============================================================================
  # Phase 5: Verify packages are available in channel
  # =============================================================================
  verify:
    needs: [check-updates, upload]
    if: always() && needs.upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for channel sync
        run: sleep 30

      - name: Verify packages in channel
        run: |
          echo "Verifying packages are available in blooop channel..."

          PACKAGES='${{ needs.check-updates.outputs.packages }}'

          echo "$PACKAGES" | jq -c '.[]' | while read -r pkg; do
            PACKAGE=$(echo "$pkg" | jq -r '.package')
            LATEST=$(echo "$pkg" | jq -r '.latest')

            echo ""
            echo "Checking $PACKAGE $LATEST..."

            for platform in noarch linux-64 linux-aarch64 osx-64 osx-arm64; do
              if curl -sL "https://prefix.dev/blooop/$platform/repodata.json" | grep -q "\"$PACKAGE-$LATEST"; then
                echo "  $platform: available"
              else
                echo "  $platform: NOT FOUND"
              fi
            done
          done

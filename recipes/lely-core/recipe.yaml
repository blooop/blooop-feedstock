schema_version: 1

context:
  version: "0.1.0"
  commit: "637de61625c9e8af2b9598109d6fb0e3a2829ce6"

package:
  name: lely-core
  version: ${{ version }}

source:
  git: https://gitlab.com/lely_industries/lely-core.git
  rev: ${{ commit }}

build:
  number: 1
  skip:
    - not linux
  script:
    - |
      # Suppress warnings-as-errors for code not updated for modern GCC
      export CFLAGS="${CFLAGS:-} -Wno-error"
      export CXXFLAGS="${CXXFLAGS:-} -Wno-error"

      # ATOMIC_VAR_INIT was deprecated in C17 and removed in C23.
      # Patch the header to define it if missing.
      if ! grep -q "ifndef ATOMIC_VAR_INIT" include/lely/util/spscring.h; then
          sed -i '/#include <lely\/libc\/stdatomic.h>/a \
      #ifndef ATOMIC_VAR_INIT\
      #define ATOMIC_VAR_INIT(value) (value)\
      #endif' include/lely/util/spscring.h
      fi

      autoreconf -i
      ./configure \
          --prefix="$PREFIX" \
          --disable-cython \
          --disable-python \
          --disable-tests \
          --disable-doc

      make -j"${CPU_COUNT}"
      make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # Pin the sysroot so the binary runs on a glibc older than the build
    # machine's. Without this the toolchain resolves whatever sysroot is
    # newest -- on the ubuntu-latest runner that produced artifacts needing
    # GLIBC_2.38/2.39, which will not exec on Debian bookworm (2.36) or
    # Ubuntu jammy (2.35). The run_export also records a `__glibc` floor, so
    # a too-new build becomes a solver error rather than a crash on first use.
    - if: linux
      then:
        - sysroot_${{ target_platform }} 2.17.*
    - autoconf
    - automake
    - libtool
    - make
    - pkg-config

tests:
  - script:
      - test -f $PREFIX/lib/liblely-can.so
      - test -f $PREFIX/lib/liblely-co.so

  # Renders and file-existence checks pass on any build machine whose glibc is
  # new enough, so they cannot catch a binary that links too new a libc. This
  # asserts the floor on the symbol table instead. The condition is on the whole
  # test item: an `if:` around the command list alone renders `script:` to
  # nothing on other platforms, which rattler-build rejects outright.
  - if: linux
    then:
      script:
        - bash ./check-glibc-floor.sh "$PREFIX/lib/liblely-can.so"
        - bash ./check-glibc-floor.sh "$PREFIX/lib/liblely-co.so"
        - bash ./check-glibc-floor.sh "$PREFIX/bin/can2udp"
      requirements:
        run:
          - binutils
          - bash
      files:
        recipe:
          - check-glibc-floor.sh

about:
  homepage: https://gitlab.com/lely_industries/lely-core
  license: Apache-2.0
  license_family: APACHE
  summary: Lely core libraries for CANopen
  description: |
    Lely core libraries providing a CANopen protocol stack implementation.
    Used for communication with CANopen-compatible motor controllers and devices.
  repository: https://gitlab.com/lely_industries/lely-core

extra:
  recipe-maintainers:
    - blooop

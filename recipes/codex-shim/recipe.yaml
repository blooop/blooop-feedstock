schema_version: 1

package:
  name: codex-shim
  # Versioned independently of Codex itself: this package ships a bootstrap shim,
  # not the Codex binary. The shim installs the latest official Codex on first run
  # and Codex self-updates thereafter, so there is no upstream version to track.
  # Named codex-shim (not codex) to avoid colliding with conda-forge's `codex`.
  version: "0.1.0"

source:
  - path: codex-shim.sh

build:
  number: 0
  script:
    - mkdir -p $PREFIX/bin
    - cp $SRC_DIR/codex-shim.sh $PREFIX/bin/codex
    - chmod +x $PREFIX/bin/codex

requirements:
  run:
    # Needed to fetch the official installer on first run.
    - curl

tests:
  - script:
      - if: unix
        then:
          - which codex
          - test -x $PREFIX/bin/codex
          - bash -n $PREFIX/bin/codex  # syntax check (running it would trigger the network install)

about:
  homepage: https://github.com/openai/codex
  license: Apache-2.0
  license_family: APACHE
  summary: Bootstrap installer for OpenAI's Codex CLI (exposes the `codex` command)
  description: |
    Codex CLI is OpenAI's lightweight coding agent that runs in your terminal.

    This package provides a thin bootstrap shim, installed as `codex`. On first
    run it performs OpenAI's official "standalone" install into ~/.codex — exactly
    what `curl | sh` produces — and then hands off to it. Because the real install
    is what actually runs, every install-aware feature behaves natively:

    - `codex update` updates Codex in place (managed entirely by Codex, in ~/.codex)
    - `codex doctor` and other diagnostics report correctly

    It always bootstraps the latest Codex release (well ahead of the conda-forge
    `codex` package) and Codex self-updates thereafter, so this package is versioned
    independently and never needs re-publishing when Codex releases a new version.

    This shim does NOT redistribute Codex; it downloads the official binary from
    OpenAI on first use. It is named `codex-shim` (rather than `codex`) so it never
    collides with the conda-forge `codex` package.

    Env vars: CODEX_HOME (install root), CODEX_RELEASE (pin first-run version),
    CODEX_INSTALLER_URL (override installer), DEBUG_SHIM=1 (diagnostics).
  documentation: https://developers.openai.com/codex/cli/
  repository: https://github.com/openai/codex

extra:
  recipe-maintainers:
    - blooop

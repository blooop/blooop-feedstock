schema_version: 1

package:
  name: speedtest-go
  version: "1.8.1"

source:
  - url: https://github.com/showwin/speedtest-go/releases/download/v1.8.1/speedtest-go_1.8.1_Linux_x86_64.tar.gz  # [linux and x86_64]
    sha256: 7830532dd42140868095d1441508b7285bbd0fad1b0c52209f4d664651811ec7  # [linux and x86_64]
    target_directory: linux-x86_64  # [linux and x86_64]
  - url: https://github.com/showwin/speedtest-go/releases/download/v1.8.1/speedtest-go_1.8.1_Linux_arm64.tar.gz  # [linux and aarch64]
    sha256: ab5fad648da854920dbdef211a4f783b0881f47b581b01190533a2fd38743deb  # [linux and aarch64]
    target_directory: linux-aarch64  # [linux and aarch64]
  - url: https://github.com/showwin/speedtest-go/releases/download/v1.8.1/speedtest-go_1.8.1_Darwin_x86_64.tar.gz  # [osx and x86_64]
    sha256: 1731403e11eb4c525a4190fde9257db9a15a0d8d5d723b5086fcd85a36a11610  # [osx and x86_64]
    target_directory: osx-x86_64  # [osx and x86_64]
  - url: https://github.com/showwin/speedtest-go/releases/download/v1.8.1/speedtest-go_1.8.1_Darwin_arm64.tar.gz  # [osx and arm64]
    sha256: 245c559921e1c847fbbf8845b21c94e36237c20554c9ff73d14519764c258482  # [osx and arm64]
    target_directory: osx-arm64  # [osx and arm64]
  - url: https://github.com/showwin/speedtest-go/releases/download/v1.8.1/speedtest-go_1.8.1_Windows_x86_64.tar.gz  # [win]
    sha256: f2303d0a82d618e81b72c325e0c7a67e791b09567fca4f6d77c47797dd4df82c  # [win]
    target_directory: win-x86_64  # [win]

build:
  number: 0
  script:
    - if: unix
      then:
        - mkdir -p "$PREFIX/bin"
        - |
          # Determine the correct source directory based on platform
          case "${target_platform:-}" in
            linux-64)      SRC_SUBDIR="linux-x86_64" ;;
            linux-aarch64) SRC_SUBDIR="linux-aarch64" ;;
            osx-64)        SRC_SUBDIR="osx-x86_64" ;;
            osx-arm64)     SRC_SUBDIR="osx-arm64" ;;
            *) echo "Unsupported target_platform: ${target_platform:-unknown}" && exit 1 ;;
          esac

          BINARY_PATH="$SRC_DIR/$SRC_SUBDIR/speedtest-go"
          if [ -f "$BINARY_PATH" ]; then
            install -m755 "$BINARY_PATH" "$PREFIX/bin/speedtest-go"
          else
            # Fall back to looking in SRC_DIR directly
            if [ -f "$SRC_DIR/speedtest-go" ]; then
              install -m755 "$SRC_DIR/speedtest-go" "$PREFIX/bin/speedtest-go"
            else
              echo "Error: speedtest-go binary not found"
              echo "Looking in: $BINARY_PATH"
              echo "Also tried: $SRC_DIR/speedtest-go"
              ls -la "$SRC_DIR"
              exit 1
            fi
          fi
    - if: win
      then:
        - if not exist %PREFIX%\Library\bin mkdir %PREFIX%\Library\bin
        - copy %SRC_DIR%\win-x86_64\speedtest-go.exe %PREFIX%\Library\bin\speedtest-go.exe

tests:
  - script:
      - if: unix
        then:
          - which speedtest-go
          - test -x $PREFIX/bin/speedtest-go
          - speedtest-go --version
      - if: win
        then:
          - where speedtest-go
          - speedtest-go --version

about:
  homepage: https://github.com/showwin/speedtest-go
  license: MIT
  license_family: MIT
  summary: CLI and Go API to Test Internet Speed using speedtest.net
  description: |
    speedtest-go is a CLI and Go API to test internet speed using speedtest.net.
    It can speedtest 2x faster than speedtest.net with almost the same result.

    Features:
    - Multiple output format (e.g. JSON, JSON-lines, Unix-like format)
    - Saving mode (reducing memory usage, but slower)
    - Debug mode for troubleshooting
    - List of servers sorted by distance
  documentation: https://github.com/showwin/speedtest-go#readme
  repository: https://github.com/showwin/speedtest-go

extra:
  recipe-maintainers:
    - blooop

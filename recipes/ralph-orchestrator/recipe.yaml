schema_version: 1

package:
  name: ralph-orchestrator
  version: "2.10.1"

source:
  - if: linux and x86_64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.10.1/ralph-cli-x86_64-unknown-linux-musl.tar.xz
      sha256: 11847073c02e364e72de09e859df9eb294e796d17183cb60b8745942c3589625
  - if: linux and aarch64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.10.1/ralph-cli-aarch64-unknown-linux-musl.tar.xz
      sha256: 54b20f3e83583b59dfa71f7972fc58756202d224db077b00fae6de885ec66be3
  - if: osx and x86_64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.10.1/ralph-cli-x86_64-apple-darwin.tar.xz
      sha256: 2c86c8e7e2a942b31e5081b5f4d9efc6bee06b822621becd6756b4b984fd139a
  - if: osx and arm64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.10.1/ralph-cli-aarch64-apple-darwin.tar.xz
      sha256: fd5d25f72ecc7255e07a4d646e49b7d72fe61a5770efb2e4b5a4d66dc3375843

build:
  number: 0
  dynamic_linking:
    # Upstream ships statically-linked musl (static-pie) binaries. patchelf
    # relocation corrupts these self-contained binaries and causes a segfault
    # at runtime, so it must be disabled.
    binary_relocation: false
  script:
    - if: unix
      then:
        - mkdir -p "$PREFIX/bin"
        - cp "$SRC_DIR/ralph" "$PREFIX/bin/ralph"
        - chmod 755 "$PREFIX/bin/ralph"

tests:
  - script:
      - if: unix
        then:
          - which ralph
          - test -x $PREFIX/bin/ralph
          - |
              if "$PREFIX/bin/ralph" --version; then
                :
              else
                status=$?
                if [ "$status" -eq 126 ]; then
                  echo "Skipping runtime test for non-native binary on $(uname -m)"
                else
                  exit "$status"
                fi
              fi

about:
  homepage: https://github.com/mikeyobrien/ralph-orchestrator
  license: MIT
  license_family: MIT
  summary: Hat-based orchestration framework that keeps AI agents in a loop until done
  description: |
    Ralph Orchestrator implements the Ralph Wiggum technique for autonomous AI-driven
    development, enabling continuous iteration on tasks until completion.

    Key features:
    - Multi-backend support (Claude Code, Kiro, Gemini CLI, Codex, and more)
    - Specialized agent personas coordinating via events
    - Quality gates that enforce testing and linting standards
    - Persistent memory and task tracking
    - 31 preset configurations for different workflows
  documentation: https://github.com/mikeyobrien/ralph-orchestrator#readme
  repository: https://github.com/mikeyobrien/ralph-orchestrator

extra:
  recipe-maintainers:
    - blooop

schema_version: 1

package:
  name: ralph-orchestrator
  version: "2.9.3"

source:
  - if: linux and x86_64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.9.3/ralph-cli-x86_64-unknown-linux-gnu.tar.xz
      sha256: 6129882a1051f658bdee85a307bdd6584dc1d704a699a676cd5fc842ce427f82
  - if: linux and aarch64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.9.3/ralph-cli-aarch64-unknown-linux-gnu.tar.xz
      sha256: 19311dbec67e04eb97e20c3a9a18a8ae5a74cda442eac04fa0243c33ee94eaf9
  - if: osx and x86_64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.9.3/ralph-cli-x86_64-apple-darwin.tar.xz
      sha256: a63719619cec8871eef60b32ddb1960de785e40f3d831a25a176c49133e16e53
  - if: osx and arm64
    then:
      url: https://github.com/mikeyobrien/ralph-orchestrator/releases/download/v2.9.3/ralph-cli-aarch64-apple-darwin.tar.xz
      sha256: 457a1f273f62f8f8ce2c235c1d693da4723b6b65f718d3643f5d61ec7545e9eb

build:
  number: 0
  script:
    - if: unix
      then:
        - mkdir -p "$PREFIX/bin"
        - cp "$SRC_DIR/ralph" "$PREFIX/bin/ralph"
        - chmod 755 "$PREFIX/bin/ralph"

tests:
  - script:
      - if: unix
        then:
          - which ralph
          - test -x $PREFIX/bin/ralph
          - |
              if "$PREFIX/bin/ralph" --version; then
                :
              else
                status=$?
                if [ "$status" -eq 126 ]; then
                  echo "Skipping runtime test for non-native binary on $(uname -m)"
                else
                  exit "$status"
                fi
              fi

about:
  homepage: https://github.com/mikeyobrien/ralph-orchestrator
  license: MIT
  license_family: MIT
  summary: Hat-based orchestration framework that keeps AI agents in a loop until done
  description: |
    Ralph Orchestrator implements the Ralph Wiggum technique for autonomous AI-driven
    development, enabling continuous iteration on tasks until completion.

    Key features:
    - Multi-backend support (Claude Code, Kiro, Gemini CLI, Codex, and more)
    - Specialized agent personas coordinating via events
    - Quality gates that enforce testing and linting standards
    - Persistent memory and task tracking
    - 31 preset configurations for different workflows
  documentation: https://github.com/mikeyobrien/ralph-orchestrator#readme
  repository: https://github.com/mikeyobrien/ralph-orchestrator

extra:
  recipe-maintainers:
    - blooop

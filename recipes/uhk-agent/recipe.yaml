schema_version: 1

package:
  name: uhk-agent
  version: "10.0.0"

source:
  - url: https://github.com/UltimateHackingKeyboard/agent/releases/download/v10.0.0/UHK.Agent-10.0.0-linux-x86_64.AppImage  # [linux and x86_64]
    sha256: 14b12e5534339c34ebcc92ca1a6a6355e7210af070610ae8f08f34bd884327b7  # [linux and x86_64]
    file_name: uhk-agent.AppImage  # [linux and x86_64]
  - url: https://github.com/UltimateHackingKeyboard/agent/releases/download/v10.0.0/UHK.Agent-10.0.0-linux-arm64.AppImage  # [linux and aarch64]
    sha256: 42eeefbef69cac3d0ad9af5043ae0a31f5c734018e92ffefdb7571598c896fc2  # [linux and aarch64]
    file_name: uhk-agent.AppImage  # [linux and aarch64]

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - if: unix
      then:
        - mkdir -p "$PREFIX/bin"
        - cp "$SRC_DIR/uhk-agent.AppImage" "$PREFIX/bin/uhk-agent"
        - chmod 755 "$PREFIX/bin/uhk-agent"

tests:
  - script:
      - if: unix
        then:
          - test -x $PREFIX/bin/uhk-agent

about:
  homepage: https://ultimatehackingkeyboard.github.io/agent/
  license: LicenseRef-UHK-Agent
  license_family: Other
  summary: Configuration application for the Ultimate Hacking Keyboard
  description: |
    UHK Agent is the official configuration application for the Ultimate Hacking
    Keyboard. It allows users to customize key mappings, create macros, configure
    LED behavior, and update firmware on their UHK hardware.

    This package installs the AppImage binary for Linux. It requires libfuse2 to
    run and may need the --no-sandbox flag on some systems.
  documentation: https://github.com/UltimateHackingKeyboard/agent/wiki
  repository: https://github.com/UltimateHackingKeyboard/agent

extra:
  recipe-maintainers:
    - blooop

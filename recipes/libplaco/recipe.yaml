schema_version: 1

context:
  version: "1.0.1"
  git_ref: "feature/update-to-main"

package:
  name: libplaco
  version: ${{ version }}

source:
  git: https://github.com/kinisi-robotics/placo.git
  rev: ${{ git_ref }}

build:
  number: 1
  skip:
    - not linux
  script:
    - |
      # Remove eigenpy dependency when building without Python bindings
      sed -i 's/find_package(eigenpy REQUIRED)/# find_package(eigenpy REQUIRED) -- disabled for C++ only build/' CMakeLists.txt

      mkdir build && cd build

      cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PREFIX" \
          -DCMAKE_PREFIX_PATH="$PREFIX" \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_TESTING=OFF

      ninja -j"${CPU_COUNT}"
      ninja install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # Pin the sysroot so the binary runs on a glibc older than the build
    # machine's. Without this the toolchain resolves whatever sysroot is
    # newest -- on the ubuntu-latest runner that produced artifacts needing
    # GLIBC_2.38, which will not exec on Debian bookworm (2.36) or Ubuntu
    # jammy (2.35). The run_export also records a `__glibc` floor, so a
    # too-new build becomes a solver error rather than a crash on first use.
    #
    # 2.28 rather than 2.17: the sysroot carries kernel headers as well as
    # glibc, and 2.17's are 2.6.32 -- too old for the CAN netlink attributes
    # this builds against. 2.28 ships 4.18 headers and still clears both
    # distros in the install-test matrix.
    - if: linux
      then:
        - sysroot_${{ target_platform }} 2.28.*
    - cmake >=3.22
    - ninja
    - pkg-config
  host:
    - libpinocchio >=3.5
    - libcoal >=3.0
    # `find_package(Eigen3 3 ...)`: conda-forge's eigen is 5.x now, whose
    # Eigen3Config reports version 5 and is rejected, so configure fails
    # before any of this recipe's own settings matter. Unrelated to the glibc
    # floor, but it makes the recipe unbuildable, so the floor change could
    # not be verified without it.
    - eigen >=3.4,<4
    - libboost-devel
    - jsoncpp
    - urdfdom
    - eiquadprog
  run:
    - libpinocchio >=3.5
    - libcoal >=3.0
    - eigen >=3.4,<4
    - libboost
    - jsoncpp
    - urdfdom
    - eiquadprog

tests:
  - script:
      - test -f $PREFIX/lib/liblibplaco.so

  # Renders and file-existence checks pass on any build machine whose glibc is
  # new enough, so they cannot catch a binary that links too new a libc. This
  # asserts the floor on the symbol table instead. The condition is on the whole
  # test item: an `if:` around the command list alone renders `script:` to
  # nothing on other platforms, which rattler-build rejects outright.
  - if: linux
    then:
      script:
        - bash ./check-glibc-floor.sh "$PREFIX/lib/liblibplaco.so"
      requirements:
        run:
          - binutils
          - bash
      files:
        recipe:
          - check-glibc-floor.sh

about:
  homepage: https://github.com/Rhoban/placo
  license: MIT
  license_family: MIT
  summary: Placo robot planning library (C++ only, no Python bindings)
  description: |
    Placo is a robot planning library providing inverse kinematics,
    dynamics, and trajectory optimization. This package builds the
    C++ library only (without Python bindings).
  repository: https://github.com/kinisi-robotics/placo

extra:
  recipe-maintainers:
    - blooop

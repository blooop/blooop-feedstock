[workspace]
name = "blooop-feedstock"
description = "Feedstock for blooop conda channel"
authors = ["blooop <your-email@example.com>"]
channels = ["https://prefix.dev/blooop", "conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[dependencies]
rattler-build = "*"
python = ">=3.10"
curl = "*"
pyyaml = ">=6.0.3,<7"

[tasks]
# Build specific packages
build-shim = "rattler-build build --recipe recipes/claude-shim/recipe.yaml --output-dir output"
build-shim-linux = "rattler-build build --recipe recipes/claude-shim/recipe.yaml --target-platform linux-64 --output-dir output"
build-shim-macos = "rattler-build build --recipe recipes/claude-shim/recipe.yaml --target-platform osx-64 --output-dir output"
build-shim-windows = "rattler-build build --recipe recipes/claude-shim/recipe.yaml --target-platform win-64 --output-dir output"

# Build iterfzf
build-iterfzf = "rattler-build build --recipe recipes/iterfzf/recipe.yaml --output-dir output"

# Build devpod-prerelease
build-devpod-prerelease = "rattler-build build --recipe recipes/devpod-prerelease/recipe.yaml --output-dir output"

# Build speedtest-go
build-speedtest-go = "rattler-build build --recipe recipes/speedtest-go/recipe.yaml --output-dir output"

# Build codex-shim
build-codex-shim = "rattler-build build --recipe recipes/codex-shim/recipe.yaml --output-dir output"

# Build opencode-shim
build-opencode-shim = "rattler-build build --recipe recipes/opencode-shim/recipe.yaml --output-dir output"

# Build/update pi
build-pi = "rattler-build build --recipe recipes/pi/recipe.yaml --output-dir output"
update-pi = "python scripts/update-pi.py"

# Build forgit
build-forgit = "rattler-build build --recipe recipes/forgit/recipe.yaml --output-dir output"

# Build krill
build-krill = "rattler-build build --recipe recipes/krill/recipe.yaml --output-dir output"

# Build lely-core
build-lely-core = "rattler-build build --recipe recipes/lely-core/recipe.yaml --output-dir output"

# Build isd
build-isd = "rattler-build build --recipe recipes/isd/recipe.yaml --output-dir output"

# Build zjsh
build-zjsh = "rattler-build build --recipe recipes/zjsh/recipe.yaml --output-dir output"

# Build claude-statusline
build-claude-statusline = "rattler-build build --recipe recipes/claude-statusline/recipe.yaml --output-dir output"

# Build kitty-bin (linux only — upstream ships no conda-mappable macOS/Windows artifact)
build-kitty-bin = "rattler-build build --recipe recipes/kitty-bin/recipe.yaml --output-dir output"

# Build palanteer (linux only — upstream has no macOS backend). One recipe, three
# outputs: the viewer, and the two Python modules for each Python in variants.yaml
build-palanteer = "rattler-build build --recipe recipes/palanteer/recipe.yaml --output-dir output"

# Build all packages
build-all = { depends-on = ["build-shim", "build-devpod-prerelease", "build-iterfzf", "build-speedtest-go", "build-forgit"] }

# Check for updates across all packages
check-updates = "bash scripts/check-updates.sh"

# Test local builds
test-shim = "rattler-build test --recipe recipes/claude-shim/recipe.yaml"

# Docker-based installation tests
test-docker = "bash scripts/run-docker-tests.sh"

# Clean build outputs
clean = "rm -rf output/*"

# Development tasks
lint-recipes = "bash scripts/lint-recipes.sh"

[feature.dev.dependencies]
pre-commit = "*"
black = "*"
flake8 = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
